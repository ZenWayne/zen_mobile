org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is OFF because the Chaquopy plugin (python_run, P2) is
# not compatible with it: it starts buildPython as an external process during
# configuration, and its BuildPackagesTask holds lazies that cannot be
# serialized (`env/<variant>/lib does not exist` at store time). Neither
# --configuration-cache-problems=warn nor a warm build works around it.
# Re-enable once Chaquopy ships configuration-cache support.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
